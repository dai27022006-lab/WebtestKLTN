<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo — Trang Bio Link &amp; Cửa Hàng Mini Đa Kênh</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: linear-gradient(160deg, #0f172a, #115e59); color: #f8fafc; min-height: 100vh; }
    .demo-bar { background: rgba(0,0,0,0.35); color: #d1fae5; font-size: 12px; text-align: center; padding: 6px 12px; }
    .phone { max-width: 440px; margin: 0 auto; padding: 28px 16px 52px; display: grid; gap: 12px; }
    .avatar { width: 64px; height: 64px; border-radius: 20px; background: #48b594; color: #062119; font-weight: 900; display: grid; place-items: center; margin: 0 auto; font-size: 22px; }
    .link-btn { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); border-radius: 14px; padding: 14px 16px; color: #fff; font-weight: 700; cursor: pointer; text-align: left; }
    .voucher { background: #ecfdf5; color: #065f46; border-radius: 14px; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .copy-btn { background: #187f65; color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="demo-bar">Bản xem thử minh họa (HTML Demo) • Trang Bio Link Đa Kênh</div>
  <div class="phone">
    <div class="avatar">NH</div>
    <div style="text-align:center;">
      <strong style="font-size:20px;">Nhà Hoa Decor • Gia Dụng Tối Giản</strong>
      <p style="margin:4px 0 0;color:#cbd5e1;font-size:13px;">Chốt đơn chính hãng trên Shopee, TikTok Shop hoặc nhắn Zalo tư vấn mẫu.</p>
    </div>
    <div class="voucher">
      <div><strong>Mã giảm 25K đơn từ 199K:</strong> <code>HOA25K</code></div>
      <button class="copy-btn" onclick="this.textContent='Đã chép ✓'">Sao chép</button>
    </div>
    <button class="link-btn" onclick="this.querySelector('small').textContent='Đang mở...'"><span>Gian hàng TikTok Shop (Freeship)</span><small>Mở →</small></button>
    <button class="link-btn" onclick="this.querySelector('small').textContent='Đang mở...'"><span>Shopee Mall • Đánh giá 4.9★</span><small>Mở →</small></button>
    <button class="link-btn" onclick="this.querySelector('small').textContent='Đang mở...'"><span>Zalo OA • Đặt sỉ &amp; hỗ trợ đơn nhanh</span><small>Nhắn →</small></button>
  </div>
</body>
</html>
